{% load static %}
{% block content %}
{% include 'header.html' %}




    <section class="section-padding" id="booking">
                <div class="container">
                    <div class="row">
                    
                        <div class="col-lg-8 col-12 mx-auto">
                            <div class="booking-form">
                                
                                <h2 class="text-center mb-lg-3 mb-2">Register</h2>
                            
                                {% if success_message %}
                                <div class="alert alert-success alert-dismissible fade show" role="alert">
                                    <strong>✓ Success!</strong> {{ success_message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                                {% endif %}

                                {% if error_message %}
                                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                    <strong>✗ Error!</strong> {{ error_message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                                {% endif %}
                                <form role="form" action="addreg" method="POST">
                                    {% csrf_token %}
                                    <div class="row">
                                        <div class="col-lg-6 col-12">
                                            <input type="text" name="name" id="name" class="form-control" placeholder="Full name" required>
                                        </div>

                                        <div class="col-lg-6 col-12">
                                            <input type="email" name="email" id="email" pattern="[^ @]*@[^ @]*" class="form-control" placeholder="Email address" required>
                                        </div>

                                        <div class="col-lg-6 col-12">
                                            <input type="tel" name="phone_number" id="phone" pattern="[0-9]{10}" class="form-control" placeholder="Phone: 123-456-7890">
                                        </div>

                                        <div class="col-lg-6 col-12">
                                            <input type="password" name="password" id="password" value="" placeholder="Enter Your Password" class="form-control">
                                            
                                        </div>

                                        

                                        <div class="col-lg-3 col-md-4 col-6 mx-auto">
                                            <button type="submit" class="form-control" id="submit-button">Register Now</button>
                                        </div>
                                    </div>
                                </form>

                            </div>
                        </div>

                    </div>
                </div>
            </section>





{% include 'footer.html' %}
{% endblock %}
